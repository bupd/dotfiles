# Chrome UI flags tracked with the dotfiles.
#
# These mirror chrome://flags choices:
#   vertical-tabs
#   vertical-tabs-expand-on-hover
#   vertical-tabs-grab-handle-removal
#   side-panel-flyover-animation
#   use-default-deadline-when-animating-bounds
--enable-features=VerticalTabs,VerticalTabsExpandOnHover,VerticalTabsGrabHandleRemoval,SidePanelFlyoverAnimation,UseDefaultDeadlineWhenAnimatingBounds
