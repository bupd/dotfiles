# bupd ftw
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g default-shell /usr/bin/zsh
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# use Ctrl-f for the prefix.
unbind C-b
unbind C-j
unbind C-k
set-option -g prefix C-f
bind-key C-f send-prefix
set -g mouse on

# Tmux Reload with prefix and r.
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."

# Status bar colors
set -g status-style "bg=colour236,fg=colour252"
set -g status-left-style "bg=colour236,fg=colour252"
set -g status-right-style "bg=colour236,fg=colour252"
set -g window-status-style "bg=colour236,fg=colour247"
set -g window-status-current-style "bg=colour33,fg=black,bold"
set -g message-style "bg=colour33,fg=black"
set -g message-command-style "bg=black,fg=colour81"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour33"
set -g status-position bottom
set -g status on
set -g status-left ""
set -g status-right "#[fg=#8ec07c,bold]󱍢#[default] #[fg=#1793d1,bold]"

# Wallpaper-derived theme. Generated by ~/dotfiles/bin/hypr-wallpaper-border-color.
if-shell "test -f ~/.config/tmux/wallpaper-theme.conf" "source-file ~/.config/tmux/wallpaper-theme.conf"

# Set easier window split keys
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

  # for neovim resurrect
  set -g @resurrect-strategy-nvim 'session'
  set -g @resurrect-capture-pane-contents 'on'

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]+/)?g?(view|l?n?vim?x?)(diff)?$'"

# Navigate tmux panes with Ctrl+h/j/k/l. Inside Vim/Neovim, pass the key through
# so vim-tmux-navigator can move between editor splits first.
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Resize panes with prefix + Ctrl+h/j/k/l.
bind-key -r C-h resize-pane -L 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-l resize-pane -R 5

# Move panes around with prefix + H/J/K/L.
bind-key -r H swap-pane -t '{left-of}'
bind-key -r J swap-pane -t '{down-of}'
bind-key -r K swap-pane -t '{up-of}'
bind-key -r L swap-pane -t '{right-of}'

# Easily reorder windows with CTRL+SHIFT+Arrow
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1
bind-key k run-shell "tmux neww sessionizer"

bind-key -r n new-session


# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


# Synchronize panes
bind-key y set-window-option synchronize-panes\; display-message "synchronize mode toggled."
# Mouse mode ON set -g mouse on
if-shell "test -x ~/.tmux/plugins/tpm/tpm" "run-shell ~/.tmux/plugins/tpm/tpm"
# set vi-mode

set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Keep Ctrl-f reserved for the tmux prefix. vim-tmux-navigator owns
# the root-table Ctrl-h/j/k/l bindings loaded above by TPM.
unbind -n C-f

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# increase scroll-back history
set -g history-limit 15000
