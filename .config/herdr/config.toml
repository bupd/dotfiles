onboarding = false
[terminal]
default_shell = "/usr/bin/zsh"

[ui]
agent_panel_sort = "spaces"

# Kanagawa base; focused Agent / active Space row in deep ember so the
# selected pane stands out while dimmed row text stays readable
[theme]
name = "kanagawa"

[theme.custom]
active_row_bg = "#6e3a24"

# Agent rows: agent name bold up top, space · tab dimmed below,
# space name color-coded per space (needs herdr >= 0.9.1)
[ui.sidebar.agents]
rows = [
    ["state_icon", { token = "agent", bold = true }],
    [{ token = "workspace", dim = true, rules = [
        { equals = "harbor", fg = "#89b4fa" },
        { equals = "deployment", fg = "#94e2d5" },
        { equals = "rpi", fg = "#fab387" },
        { equals = "donna", fg = "#cba6f7" },
    ] }, { token = "tab", dim = true }],
]

# Space rows: same per-space palette as the agent rows
[ui.sidebar.spaces]
rows = [
    ["state_icon", { token = "workspace", bold = true, rules = [
        { equals = "harbor", fg = "#89b4fa" },
        { equals = "deployment", fg = "#94e2d5" },
        { equals = "rpi", fg = "#fab387" },
        { equals = "donna", fg = "#cba6f7" },
    ] }],
    ["branch", "git_status"],
]

# Desktop popups (dunst) on agent done/blocked come from the local plugin in
# plugins/agent-notify, not [ui.toast]. Register once per machine:
#   herdr plugin link ~/dotfiles/.config/herdr/plugins/agent-notify

# Esc enters herdr navigate mode (vim-like). ctrl+b kept as escape hatch.
[keys]
prefix = ["esc", "ctrl+b"]
# navigate mode (prefix+w): h/l = pane left/right, j/k = sidebar spaces down/up
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
# agent picker: Esc e = list of agents, j/k hover, Enter open, / search
goto = "prefix+e"

# vim-herdr-navigation: Ctrl+h/j/k/l across herdr panes and nvim splits
# Plugin linked once per machine:
#   herdr plugin link ~/code/OSS/vim-herdr-navigation
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"
